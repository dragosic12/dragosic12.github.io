<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vídeos TPV Global</title>
<link rel="stylesheet" href="../fonts.css">
<style>
  :root {
    --bg: #f9f9f9; --card: #ffffff; --text: #1a1c1c; --muted: #424842; --line: rgb(194 200 192 / .45);
    --accent: #8b6b4a; --on-accent: #ffffff; --chip: #efe6dc; --chip-text: #362617; --shadow: 0 4px 20px rgba(26,28,28,.05);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #161412; --card: #1c1a17; --text: #f3f0ed; --muted: #c9c1b8; --line: rgb(90 82 74 / .55);
      --accent: #d0b395; --on-accent: #342414; --chip: #2a241e; --chip-text: #e8d9c8; --shadow: 0 4px 20px rgba(0,0,0,.35);
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font-family: 'Inter', -apple-system, 'Segoe UI', sans-serif; -webkit-font-smoothing: antialiased; }
  .ms { font-family: 'Material Symbols Outlined'; font-size: 22px; line-height: 1; font-feature-settings: 'liga'; }
  header { max-width: 1100px; margin: 0 auto; padding: 32px 16px 8px; display: flex; align-items: center; gap: 14px; }
  .logo { width: 48px; height: 48px; border-radius: 14px; background: var(--accent); color: var(--on-accent); display: flex; align-items: center; justify-content: center; }
  h1 { font-size: 1.5rem; margin: 0; font-weight: 800; letter-spacing: -.02em; }
  header p { margin: 2px 0 0; color: var(--muted); font-size: .92rem; }
  .back { margin-left: auto; display: inline-flex; align-items: center; gap: 6px; padding: 10px 16px; border-radius: 999px; color: var(--muted); text-decoration: none; font-weight: 600; font-size: .9rem; border: 1px solid var(--line); background: var(--card); }
  main { max-width: 1100px; margin: 0 auto; padding: 16px; display: grid; gap: 16px; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; box-shadow: var(--shadow); overflow: hidden; display: flex; flex-direction: column; }
  video { width: 100%; display: block; background: #000; max-height: 520px; object-fit: contain; }
  .body { padding: 14px 16px 16px; display: flex; flex-direction: column; gap: 10px; flex: 1; }
  .title { font-weight: 700; font-size: 1rem; }
  .meta { display: flex; gap: 8px; flex-wrap: wrap; }
  .chip { background: var(--chip); color: var(--chip-text); font-size: .75rem; font-weight: 600; padding: 4px 10px; border-radius: 999px; }
  .dl { margin-top: auto; display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 48px; border-radius: 8px; background: var(--accent); color: var(--on-accent); text-decoration: none; font-weight: 700; }
  .dl:active { transform: scale(.97); }
  .back { white-space: nowrap; }
  @media (max-width: 560px) { header { flex-wrap: wrap; } .back { margin-left: 0; order: 3; } }
  footer { max-width: 1100px; margin: 0 auto; padding: 8px 16px 40px; color: var(--muted); font-size: .85rem; }
</style>
</head>
<body>
<header>
  <div class="logo"><span class="ms">point_of_sale</span></div>
  <div>
    <h1>Vídeos de presentación</h1>
    <p>Para ver aquí o descargar y enseñar sin conexión.</p>
  </div>
  <a class="back" href="../"><span class="ms">arrow_back</span>Volver a la web</a>
</header>
<main id="list"></main>
<footer>Consejo: en el móvil, la versión vertical es la que mejor se ve a pantalla completa.</footer>
<script>
  const VIDEOS = [
    { f: 'TPVGlobal_promo_vertical_movil.mp4', t: 'TPV Global, vertical', tags: ['Para móvil', 'Solo música'] },
    { f: 'TPVGlobal_promo_horizontal_movil.mp4', t: 'TPV Global, horizontal', tags: ['Para ordenador o TV', 'Solo música'] },
    { f: 'TPVGlobal_promo_whatsapp.mp4', t: 'TPV Global, versión ligera', tags: ['Vertical', 'Para enviar'] },
  ];
  const list = document.getElementById('list');
  for (const v of VIDEOS) {
    const c = document.createElement('article');
    c.className = 'card';
    c.innerHTML = `<video controls playsinline preload="metadata" src="${v.f}"></video>
      <div class="body"><div class="title"></div><div class="meta"></div>
      <a class="dl" href="${v.f}" download><span class="ms">download</span>Descargar</a></div>`;
    c.querySelector('.title').textContent = v.t;
    c.querySelector('.meta').innerHTML = v.tags.map(x => `<span class="chip">${x}</span>`).join('');
    list.appendChild(c);
    fetch(v.f, { method: 'HEAD' }).then(r => {
      const mb = Number(r.headers.get('content-length') || 0) / 1048576;
      if (mb) c.querySelector('.meta').insertAdjacentHTML('beforeend', `<span class="chip">${mb.toFixed(0)} MB</span>`);
    }).catch(() => {});
  }
</script>
</body>
</html>
